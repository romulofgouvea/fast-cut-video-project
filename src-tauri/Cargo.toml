[package]
name = "fast-cut-video"
version = "0.0.0"
description = "Fast Cut Vídeo — baixa e recorta vídeos, no desktop"
authors = ["Romulo Gouvea"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fast_cut_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
incremental = false
